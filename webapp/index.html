<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ева · Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/static/style.css">
</head>
<body>
  <div id="app">
    <div class="loading" id="loading">
      <div class="spark-loader">✦</div>
      <div>Ева считает твои числа…</div>
    </div>
  </div>

  <!-- нижняя навигация -->
  <nav class="tabbar" id="tabbar" style="display:none">
    <button class="tab active" data-tab="matrix">
      <span class="tab-ico">✦</span><span>Матрица</span>
    </button>
    <button class="tab" data-tab="catalog">
      <span class="tab-ico">🔮</span><span>Разборы</span>
    </button>
    <button class="tab" data-tab="mine">
      <span class="tab-ico">📚</span><span>Мои</span>
    </button>
    <button class="tab" data-tab="premium">
      <span class="tab-ico">💎</span><span>Ева</span>
    </button>
    <button class="tab" data-tab="more">
      <span class="tab-ico">⚙️</span><span>Ещё</span>
    </button>
  </nav>

  <script src="/app/static/app.js"></script>
</body>
</html>
