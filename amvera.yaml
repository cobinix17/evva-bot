# Конфигурация деплоя на Amvera Cloud.
#
# Собираем тем же Dockerfile, что и на Railway — он уже ставит системные
# библиотеки для WeasyPrint (генерация PDF), так что окружение получается
# один в один и никаких сюрпризов с рендером отчётов быть не должно.
#
# containerPort обязан совпадать с портом, который слушает приложение
# (bot.py: run_web берёт PORT из окружения, по умолчанию 8080). Если тут
# указать не тот порт, Amvera отдаёт «503 Service Unavailable», а логи
# приложения при этом выглядят нормально — искать причину долго.
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  dockerfile: Dockerfile
  skip: false

run:
  # Постоянное хранилище. Бот ничего не пишет на диск (PDF собирается в
  # памяти и сразу уходит в Telegram, всё состояние — в PostgreSQL), так
  # что папка стоит пустой. Оставляем на будущее и чтобы конфиг был полным.
  persistenceMount: /data
  containerPort: 8080
