# Конфигурация Nixpacks для Railway.
#
# Зачем этот файл: PyEnchant (используется в bot.py для исправления
# орфографических опечаток в ответах AI) — это Python-обёртка над системной
# библиотекой Enchant, которая сама по себе не содержит словарей. Ей нужен
# системный пакет enchant2 (сама библиотека) и словарь hunspell для русского
# языка (hunspellDicts.ru_RU). Без этого файла Railway не поставит их
# автоматически — питоновские пакеты из requirements.txt этого не покрывают.
#
# Если по какой-то причине эти Nix-пакеты не найдутся при сборке — бот всё
# равно запустится: orthography-модуль в bot.py (_get_spell_dict) ловит
# исключение и просто отключает проверку орфографии, не прерывая работу.

[phases.setup]
nixPkgs = ["...", "enchant2", "hunspell", "hunspellDicts.ru_RU"]