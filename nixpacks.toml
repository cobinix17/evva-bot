# Системные библиотеки для WeasyPrint (генерация PDF через HTML/CSS, см. pdf.py).
#
# ВАЖНО: используем aptPkgs, а НЕ nixPkgs. Первая попытка (nixPkgs = ["pango", ...])
# не сработала в проде: пакет собрался при билде, но в рантайме
# ctypes.util.find_library('libpango-1.0-0') всё равно не находил библиотеку —
# Nix-пакеты живут в /nix/store и не регистрируются в системном ldconfig,
# через который ищет библиотеки ctypes. apt-пакеты ставятся в обычные
# системные пути и подхватываются ldconfig автоматически.
#
# Если и это почему-то не заведётся — pdf.py сам откатится на резервный
# fpdf-рендер (см. generate_pdf() в pdf.py), бот всё равно пришлёт PDF.
[phases.setup]
aptPkgs = [
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libpangoft2-1.0-0",
    "libcairo2",
    "libgdk-pixbuf2.0-0",
    "libffi8",
    "shared-mime-info",
]
