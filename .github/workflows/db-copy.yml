# Разовый перенос базы со старого Railway-аккаунта на новый.
#
# Запускается только руками (workflow_dispatch) и только тем, у кого есть
# доступ на запись — с форков и pull request'ов секреты недоступны.
#
# Дамп НЕ выкладывается артефактом: репозиторий публичный, а в базе имена,
# даты рождения, telegram id и почты живых людей — такой артефакт смог бы
# скачать кто угодно. Поэтому копируем сразу из базы в базу, файл живёт
# только внутри одного запуска и умирает вместе с ним.
name: Перенос базы

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напиши "перенести" — иначе запуск остановится'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение
        run: |
          if [ "${{ inputs.confirm }}" != "перенести" ]; then
            echo "Не подтверждено — в поле надо написать: перенести"
            exit 1
          fi

      # На раннере стоит клиент старой версии, а сервер новее — pg_dump
      # откажется работать с более новым сервером. Ставим свежий клиент.
      - name: Поставить свежий postgresql-client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Снять дамп со старой базы
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
        run: |
          pg_dump "$OLD_DATABASE_URL" --no-owner --no-acl -Fc -f /tmp/evva.dump
          ls -lh /tmp/evva.dump

      - name: Что в дампе
        run: pg_restore --list /tmp/evva.dump | grep "TABLE DATA" || true

      - name: Сколько строк было в старой базе
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
        run: |
          psql "$OLD_DATABASE_URL" -At -c "
            SELECT 'users=' || (SELECT count(*) FROM users)
                || ' payments=' || (SELECT count(*) FROM payments)
                || ' readings=' || (SELECT count(*) FROM generated_readings);"

      # --clean --if-exists: в новой базе бот уже мог создать пустые таблицы
      # при первом старте. Без этого restore упёрся бы в существующие объекты.
      - name: Залить в новую базу
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          pg_restore -d "$NEW_DATABASE_URL" --no-owner --no-acl \
            --clean --if-exists --no-comments /tmp/evva.dump

      - name: Сколько строк стало в новой базе
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -At -c "
            SELECT 'users=' || (SELECT count(*) FROM users)
                || ' payments=' || (SELECT count(*) FROM payments)
                || ' readings=' || (SELECT count(*) FROM generated_readings);"
          echo "Числа должны совпасть с шагом «Сколько строк было»."
